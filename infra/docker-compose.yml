services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: rag_nexus
      MYSQL_USER: rag
      MYSQL_PASSWORD: change-me
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mariadb_data:
  qdrant_data:
